{% comment %}Params: slot, name, date, qty, max_quantity{% endcomment %}
<div class="slot{% if slot == 'dinner' %} slot--dinner{% endif %}{% if qty %} is-on{% endif %}"
     data-slot="{{ slot }}" data-date="{{ date|date:'Y-m-d' }}" data-qty="{{ qty }}">

  <button type="button" class="slot__main" data-slot-toggle
          aria-pressed="{% if qty %}true{% else %}false{% endif %}">
    <span class="slot__check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
           stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </span>
    <span class="slot__text">
      <span class="slot__name">{{ name }}</span>
      <span class="slot__hint" data-slot-hint>
        {% if qty %}{{ qty }} meal{{ qty|pluralize }}{% else %}Skipped{% endif %}
      </span>
    </span>
  </button>

  <div class="stepper" role="group" aria-label="{{ name }} quantity">
    <button type="button" class="stepper__btn" data-step="-1" aria-label="One less {{ name }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <span class="stepper__value" data-qty-value aria-live="polite">{{ qty }}</span>
    <button type="button" class="stepper__btn" data-step="1" aria-label="One more {{ name }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</div>
